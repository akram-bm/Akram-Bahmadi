<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - Akram Portfolio</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .landing {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: linear-gradient(135deg, #00b894, #0984e3);
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .rotating-text-container {
      position: relative;
      width: 90%;
      max-width: 900px;
      min-height: 180px;          /* ← important: give space */
      margin: 0 auto 40px;
      overflow: hidden;
    }

    .text-group {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }

    .text-group.active {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-size: 2.8rem;
      margin: 0 0 15px 0;
      line-height: 1.1;
    }

    p {
      font-size: 1.6rem;
      margin: 0;
      opacity: 0.9;
    }

    .lang-buttons {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 1.3rem;
      padding: 14px 32px;
      border: 2px solid white;
      border-radius: 12px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: white;
      color: #0984e3;
    }
  </style>
</head>
<body>

<section class="landing">
  <div class="content">

    <div class="rotating-text-container">
      <div class="text-group">
        <h1>Select your preferred language</h1>
        <p>for portfolio</p>
      </div>

      <div class="text-group">
        <h1>Sélectionnez votre langue préférée</h1>
        <p>pour le portfolio</p>
      </div>

      <div class="text-group">
        <h1>Seleccione su idioma preferido</h1>
        <p>para el portafolio</p>
      </div>
    </div>

    <div class="lang-buttons">
      <a href="#" class="btn">English</a>
      <a href="#" class="btn">Français</a>
      <a href="#" class="btn">Español</a>
    </div>

  </div>
</section>

<script>
  console.log("Script is running!"); // ← open DevTools (F12) → Console tab to see this

  const groups = document.querySelectorAll('.rotating-text-container .text-group');
  console.log("Found groups:", groups.length); // should be 3

  if (groups.length === 0) {
    console.error("No .text-group elements found!");
  }

  let index = 0;

  function showNext() {
    groups.forEach(g => g.classList.remove('active'));
    groups[index].classList.add('active');
    console.log("Showing index:", index);
    index = (index + 1) % groups.length;
  }

  // Start right away
  showNext();
  setInterval(showNext, 2500);
</script>

</body>
</html>

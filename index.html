<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akram BAHMADI - Portfolio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="landing">
  <div class="overlay"></div>
  <div class="content">

    <div class="rotating-text-container">
      <h1 class="lang">Select your preferred language</h1>
      <h1 class="lang">Sélectionnez votre langue préférée</h1>
      <h1 class="lang">Seleccione su idioma preferido</h1>

      <p class="lang">for portfolio</p>
      <p class="lang">pour le portfolio</p>
      <p class="lang">para el portafolio</p>
    </div>

    <div class="lang-buttons">
      <a href="about-en.html" class="btn">English</a>
      <a href="about-fr.html" class="btn">Français</a>
      <a href="about-es.html" class="btn">Español</a>
    </div>

  </div>
</section>

<script>
const h1s = document.querySelectorAll('.rotating-text-container h1');
const ps = document.querySelectorAll('.rotating-text-container p');

let index = 0;
const total = h1s.length;

function showNext() {
  // hide all first
  h1s.forEach(h => h.style.opacity = 0);
  ps.forEach(p => p.style.opacity = 0);

  // show only current
  h1s[index].style.opacity = 1;
  ps[index].style.opacity = 1;

  // move to next
  index = (index + 1) % total;
}

// show first immediately
showNext();

// loop every 1s
setInterval(showNext, 1000);
</script>

</body>
</html>

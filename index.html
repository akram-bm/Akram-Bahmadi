<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akram BAHMADI - Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="landing">
  <div class="overlay"></div>
  <div class="content">

    <div class="rotating-text-container">
      <div class="text-group">
        <h1>Select your preferred language</h1>
        <p>for portfolio</p>
      </div>
      <div class="text-group">
        <h1>Sélectionnez votre langue préférée</h1>
        <p>pour le portfolio</p>
      </div>
      <div class="text-group">
        <h1>Seleccione su idioma preferido</h1>
        <p>para el portafolio</p>
      </div>
    </div>

    <div class="lang-buttons">
      <a href="about-en.html" class="btn">English</a>
      <a href="about-fr.html" class="btn">Français</a>
      <a href="about-es.html" class="btn">Español</a>
    </div>

  </div>
</section>

<script>
  const groups = document.querySelectorAll('.rotating-text-container .text-group');
  let index = 0;
  const total = groups.length;

  function showNext() {
    groups.forEach(group => group.classList.remove('active'));
    groups[index].classList.add('active');
    index = (index + 1) % total;
  }

  // Show first one immediately
  showNext();

  // Change every ~2.2 seconds (feels natural)
  setInterval(showNext, 2200);
</script>

</body>
</html>

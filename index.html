<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akram BAHMADI - Portfolio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="landing">
  <div class="overlay"></div>
  <div class="content">

    <div class="rotating-text-container">
      <h1>Select your preferred language</h1>
      <h1>Sélectionnez votre langue préférée</h1>
      <h1>Seleccione su idioma preferido</h1>

      <p>for portfolio</p>
      <p>pour le portfolio</p>
      <p>para el portafolio</p>
    </div>

    <div class="lang-buttons">
      <a href="about-en.html" class="btn">English</a>
      <a href="about-fr.html" class="btn">Français</a>
      <a href="about-es.html" class="btn">Español</a>
    </div>

  </div>
</section>

<script>
const headers = document.querySelectorAll('.rotating-text-container h1');
const paragraphs = document.querySelectorAll('.rotating-text-container p');
let current = 0;

function showNext() {
  // Hide all
  headers.forEach(h => h.style.opacity = 0);
  paragraphs.forEach(p => p.style.opacity = 0);

  // Show current
  headers[current].style.opacity = 1;
  paragraphs[current].style.opacity = 1;

  // Move to next
  current = (current + 1) % headers.length;
}

// Initial display
showNext();

// Change every 1 second
setInterval(showNext, 1000);
</script>

</body>
</html>
